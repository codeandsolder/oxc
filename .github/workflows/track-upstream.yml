name: Track upstream

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@c9cff3b64df2fb2295270a09e8e38dbf18e31daf # main
    with:
      upstream-repository: oxc-project/oxc
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      rust-toolchain: repository
      validation-script: .github/scripts/validate-upstream.sh
